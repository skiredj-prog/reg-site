name: preview
# Builds and checks on every push, for both paths the site may be served
# under: / (its own domain) and /reg-site/ (a GitHub Pages project site).
# Builds the Pages artifact and deploys only when run by hand (Actions >
# preview > Run workflow), so nothing goes live by accident. The files of that
# artifact are attested (signed build provenance) before it is uploaded.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the preview to GitHub Pages"
        type: boolean
        default: false
      base:
        description: "Path the Pages artifact is built for (/ or /reg-site/)"
        type: string
        default: "/"
      site:
        description: "Origin the Pages artifact is built for (scheme and host, no path)"
        type: string
        default: "https://reg.tenirlabs.cc"
permissions:
  contents: read
# One run at a time per branch and event; a run waits rather than being
# cancelled, so a hand-started deployment is never cut short.
concurrency:
  group: preview-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  build:
    name: build (${{ matrix.base }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - base: "/"
            site: "https://reg.tenirlabs.cc"
            artifact: dist-root
          # Exercises a build under a subpath. The origin is a neutral
          # placeholder: this entry is a test, not a hosting target.
          - base: "/reg-site/"
            site: "https://example.org"
            artifact: dist-reg-site
    env:
      SITE_BASE: ${{ matrix.base }}
      SITE_URL: ${{ matrix.site }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm run build
      - name: Pinned projection matches reg-platform
        run: node scripts/verify-remote.mjs
        env:
          REQUIRE_PLATFORM_PIN: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
      - name: Browser checks (375px and 1280px)
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          node scripts/serve.mjs 4173 --base="$SITE_BASE" &
          sleep 1
          node scripts/check-viewports.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: dist
  pages:
    # The artifact GitHub Pages would serve, built and checked for the base
    # and the site given by hand.
    name: pages
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
      id-token: write # a short-lived OIDC identity, which Sigstore certifies for the signature
      attestations: write # store the signed provenance statement on the repository
    env:
      SITE_BASE: ${{ inputs.base }}
      SITE_URL: ${{ inputs.site }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm run build
      - name: Pinned projection matches reg-platform
        run: node scripts/verify-remote.mjs
        env:
          REQUIRE_PLATFORM_PIN: "1"
      - name: Browser checks (375px and 1280px)
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          node scripts/serve.mjs 4173 --base="$SITE_BASE" &
          sleep 1
          node scripts/check-viewports.mjs
      - name: Checksums of every file the artifact serves
        # Shasum format, paths as served under the base. actions/attest takes
        # at most 1024 subjects: past that, the list itself would be the subject.
        run: |
          (cd dist && find . -type f | sed 's|^\./||' | LC_ALL=C sort | xargs -d '\n' sha256sum) > "$RUNNER_TEMP/SHA256SUMS"
          n=$(wc -l < "$RUNNER_TEMP/SHA256SUMS")
          echo "$n files"
          test "$n" -gt 0 && test "$n" -le 1024
      - name: Attest the provenance of the served files
        # Signed statement that this workflow, in this run and at this commit,
        # built files with these digests. Public repository: Sigstore's public
        # instance, a permanent public record. A failure here fails the job,
        # so nothing unattested is deployed. See docs/DEPLOYMENT.md, Provenance.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: ${{ runner.temp }}/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pages-sha256sums
          path: ${{ runner.temp }}/SHA256SUMS
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
  deploy:
    name: deploy
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
    needs: pages
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish the uploaded artifact to GitHub Pages
      id-token: write # the OIDC identity deploy-pages presents to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
